name: Refresh Bulletin data

on:
  schedule:
    - cron: "0 7 * * 2" # Tuesdays 07:00 UTC; the Bulletin is published on Mondays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run data:refresh
      - id: commit
        run: |
          if git diff --quiet -- public/weather.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new Bulletin data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/weather.json
            git commit -m "Refresh Weekly Oil Bulletin snapshot"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
